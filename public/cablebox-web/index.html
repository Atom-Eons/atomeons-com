<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CableBox</title>
<style>
  /* Pixel-exact to CBX-FINAL-V1 native:
     - theme PNG (1536x1024) is the ONLY screen mask via its alpha hole
     - video sits BEHIND theme, fitted to per-theme aperture rect + 3% tuck
     - CRT canvas sits between video and theme, painted with same constants
   */
  html, body { margin: 0; padding: 0; background: #000; height: 100vh; overflow: hidden;
    font-family: 'Consolas','Menlo',monospace; color: #fff; user-select: none; cursor: crosshair; }
  #cabinet {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    aspect-ratio: 1536 / 1024;
    height: 100vh; max-width: 100vw;
    /* If the viewport is wider than the aspect can fill in height, cap width. */
    max-height: 100vh;
    border-radius: 22px;    /* DWM native ~ 22-28px radius on this scale */
    overflow: hidden;
    background: transparent;
  }
  #video, #crt {
    position: absolute;
    /* left/top/width/height set from JS in per-theme % of cabinet size */
  }
  #video { object-fit: cover; background: #000; }
  #crt { pointer-events: none; }
  #shell {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    image-rendering: -webkit-optimize-contrast;
  }
  #osd {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    padding: 5px 12px; border-radius: 6px;
    background: rgba(0,0,0,0.75); color: #f5f0d0;
    font: 700 13px/1 inherit; letter-spacing: 0.06em;
    opacity: 0; transition: opacity .18s; z-index: 20;
  }
  #osd.on { opacity: 1; }
</style>
</head>
<body>
  <div id="cabinet">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="crt"></canvas>
    <img id="shell" alt="" draggable="false" />
  </div>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
